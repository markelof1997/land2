<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleConnect</title>

  <style>
    body {
      font-family: "Inter", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #fafafa;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    button {
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 16px 34px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #0077b5;
    }

    .hint {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>Подключись к нашему Telegram-каналу</h1>
  <p>Нажми на кнопку ниже 👇</p>

 <button onclick="window.location.href='/go'">Перейти в Telegram</button>


  <div class="hint">Если не открывается — нажми ••• и выбери «Открыть в браузере»</div>

  <!-- index.html -->
<button id="openTelegram">Перейти в Telegram</button>

<script>
  document.getElementById("openTelegram").addEventListener("click", () => {
    // Просто идём на прокладку /go.html на твоём домене
    window.location.href = "/go.html";
  });
</script>

</body>
</html>
