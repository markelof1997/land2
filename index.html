<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleConnect</title>

  <style>
    body {
      font-family: "Inter", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #fafafa;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    button {
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 16px 34px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #0077b5;
    }

    .hint {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>Подключись к нашему Telegram-каналу</h1>
  <p>Нажми на кнопку ниже 👇</p>

  <button id="openTelegram">Перейти в Telegram</button>

  <div class="hint">Если не открывается — нажми ••• и выбери «Открыть в браузере»</div>

  <script>
    const telegramLink = "https://ultimatecommunity.mssg.me/";

    document.getElementById("openTelegram").addEventListener("click", () => {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isTikTok = ua.includes("TikTok");

      if (isTikTok) {
        try {
          // Пытаемся открыть ссылку в новой вкладке (часто выбрасывает наружу)
          window.open(telegramLink, "_blank");
        } catch (e) {}

        // Если TikTok всё ещё блокирует, показываем подсказку
        setTimeout(() => {
          alert(
            "Если Telegram не открылся, нажми ••• в TikTok и выбери 'Открыть в браузере', затем попробуй снова 🔗"
          );
        }, 1200);
      } else {
        // Если это нормальный браузер — просто редиректим
        window.location.href = telegramLink;
      }
    });
  </script>
</body>
</html>
