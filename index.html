<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ULTIMATE COMMUNITY</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      margin-bottom: 2rem;
      color: #ccc;
      max-width: 500px;
    }
    button {
      background: #00ff99;
      color: #000;
      border: none;
      padding: 16px 32px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.3s;
    }
    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>THE ULTIMATE COMMUNITY</h1>
  <p>Комьюнити единомышленников, которое помогает быстрее достигать результатов в работе.</p>
  
  <!-- Кнопка без редиректа -->
  <button onclick="join()">ПРИСОЕДИНИТЬСЯ</button>

  <script>
    function join() {
      alert("Спасибо за интерес! Функция присоединения будет доступна позже.");
    }
  </script>
</body>
</html>
