<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Открытие Telegram</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wrap {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 320px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: #0088cc;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Переход в Telegram</h1>
    <button class="btn" onclick="openTG()">Перейти</button>
  </div>

<script>
function openTG() {
  const user = "amayaboutique";

  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isIOS) {
    // 1. Выталкиваем из TikTok во внешнее приложение (App Store)
    window.location.href = "https://apps.apple.com/app/telegram-messenger/id686449807";

    // 2. Ждем пока App Store откроется (человек жмет "Відкрити" → Telegram открывается)
    // 3. Потом Telegram получает ссылку на канал из Safari
    setTimeout(() => {
      // Сначала открываем Safari:
      window.open("https://t.me/" + user, "_blank");
    }, 1800);

  } else {
    // Android
    window.location.href = "intent://t.me/" + user + "#Intent;scheme=https;package=com.android.chrome;end";
    setTimeout(() => {
      window.location.href = "tg://resolve?domain=" + user;
    }, 400);
    setTimeout(() => {
      window.location.href = "https://t.me/" + user;
    }, 1000);
  }
}
</script>

</body>
</html>
