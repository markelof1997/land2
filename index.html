<script>
  const tgUsername = "amayaboutique"; // <-- твой username

  function openTelegram() {
    // сначала пробуем открыть приложение Telegram
    window.location.href = tg://resolve?domain=${tgUsername};

    // если Telegram не открылся за 800 мс — переводим в браузер Telegram
    setTimeout(() => {
      window.location.href = https://t.me/${tgUsername};
    }, 800);
  }

  // запускаем при клике на кнопку
  document.getElementById("openTG").addEventListener("click", openTelegram);

  // Авто-открытие при заходе со скролла TikTok (по желанию — могу отключить)
  setTimeout(() => {
    openTelegram();
  }, 1200);
</script>


<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Переход...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 300px;
      padding: 20px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: 600;
      color: #111;
    }
    .cta-button {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #0088cc;
      color: #fff;
      transition: 0.2s;
    }
    .cta-button:active {
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Открытие Telegram...</h1>
    <button id="openTG" class="cta-button">Перейти в Telegram</button>
  </div>

  <script>
    const tgUsername = "amayaboutique";

    function openTelegram() {
      // открыт приложение Telegram
      window.location.href = tg://resolve?domain=${tgUsername};

      // если не установлено — fallback в web-версию, но уже вне TikTok
      setTimeout(() => {
        window.location.href = https://t.me/${tgUsername};
      }, 800);
    }

    document.getElementById("openTG").addEventListener("click", openTelegram);
  </script>
</body>
</html>
