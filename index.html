<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ULTIMATE COMMUNITY</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      margin-bottom: 2rem;
      color: #ccc;
      max-width: 500px;
    }
    a.button {
      display: inline-block;
      background: #00ff99;
      color: #000;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      transition: transform 0.3s;
    }
    a.button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>THE ULTIMATE COMMUNITY</h1>
  <p>Комьюнити единомышленников, которое помогает быстрее достигать результатов в работе.</p>
  <a id="openTelegram" class="button" href="#">ПРИСОЕДИНИТЬСЯ</a>

  <script>
    const telegramAppLink = "tg://resolve?domain=amayaboutique";
    const telegramWebLink = "https://web.telegram.org/k/#@amayaboutique";

    const button = document.getElementById("openTelegram");

    button.addEventListener("click", (e) => {
      e.preventDefault();

      // Попытка открыть Telegram приложение
      window.location.href = telegramAppLink;

      // Через 2 секунды — fallback на web Telegram
      setTimeout(() => {
        window.location.href = telegramWebLink;
      }, 2000);
    });
  </script>
</body>
</html>
