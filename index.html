<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Открытие Telegram</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wrap {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 320px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: #0088cc;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Переход в Telegram</h1>
   <button id="tgBtn" style="padding:14px 20px; border-radius:8px; border:none; font-size:18px; font-weight:600; cursor:pointer;">
    Открыть Telegram
</button>
  </div>

<script>
function isInTikTokWebView() {
  return /tiktok/i.test(navigator.userAgent);
}

function openExternal() {
  const url = "https://t.me/theultimatee";
  window.location.href = url;
}

document.getElementById("tgBtn").addEventListener("click", function () {

  // 1. Если мы внутри браузера TikTok → насильно открываем Safari/Chrome
  if (isInTikTokWebView()) {

    // iPhone — открываем через safari
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      window.open("https://t.me/theultimatee", "_blank");
      return;
    }

    // Android — открываем через intent (обходит встроенный WebView)
    window.location.href = "intent://t.me/theultimatee#Intent;scheme=https;package=org.telegram.messenger;end";
    return;
  }

  // 2. Если уже внешний браузер → открываем сразу
  openExternal();
});
</script>

</body>
</html>
