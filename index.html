<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Закрытый клуб успешных женщин</title>

  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-eIV2u5pPio9i-CywAjwrf.js"></script>
  <script>
    window.plausible = window.plausible || function() {
      (plausible.q = plausible.q || []).push(arguments)
    }, plausible.init = plausible.init || function(i) {
      plausible.o = i || {}
    };
    plausible.init()
  </script>

  <!-- Подключаем Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #ffc3a0 100%);
      color: #fff;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      margin-bottom: 16px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }

    p {
      font-size: 20px;
      margin-bottom: 20px;
      max-width: 90%;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.2);
    }

    .price {
      font-size: 24px;
      margin-bottom: 30px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
    }

    .price del {
      color: rgba(255,255,255,0.6);
      margin-right: 10px;
    }

    .timer {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
      background: rgba(0,0,0,0.25);
      padding: 10px 20px;
      border-radius: 12px;
      display: inline-block;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }

    button {
      background: #ff4f70;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 18px 50px;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      font-family: 'Inter', sans-serif;
    }

    button:hover {
      background: #ff2f50;
      transform: translateY(-3px);
    }

    .hint {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255,255,255,0.9);
    }
  </style>
</head>
<body>
  <h1>Закрытый клуб успешных женщин</h1>
  <p>Войдите в клуб, где женщины делятся секретами успеха, богатых знакомств, заработка и гармоничной жизни.</p>

  <div class="price">
    <del>$149</del> <span style="font-weight: 700;">$0</span> — абсолютно бесплатно!
  </div>

  <div class="timer" id="timer">13:00</div>

  <button id="openTelegram">Присоединиться к клубу в Telegram</button>

  <div class="hint">Если не открывается — нажми ••• и выбери «Открыть в браузере»</div>

  <script>
    // Таймер на 13 минут
    let time = 13 * 60; // секунд
    const timerEl = document.getElementById('timer');

    const countdown = setInterval(() => {
      let minutes = Math.floor(time / 60);
      let seconds = time % 60;
      timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
      time--;
      if(time < 0) clearInterval(countdown);
    }, 1000);

    document.getElementById("openTelegram").addEventListener("click", () => {
      // Отправляем событие в Plausible
      plausible('click-telegram');

      // Переходим на Telegram-ссылку
      window.location.href = "https://ultimatecommunity.mssg.me/";
    });
  </script>
</body>
</html>
