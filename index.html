<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ULTIMATE COMMUNITY</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }

    p {
      max-width: 600px;
      line-height: 1.6;
      font-size: 1.1rem;
      color: #cccccc;
      margin-bottom: 2rem;
    }

    a.button {
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      padding: 0.9rem 2rem;
      border-radius: 8px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    a.button:hover {
      background: #00ff99;
      color: #000;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <h1>THE ULTIMATE COMMUNITY</h1>
    <p>
