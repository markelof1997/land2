<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Открытие Telegram</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wrap {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 320px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: #0088cc;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Переход в Telegram</h1>
    <button onclick="redirect()">Перейти в Telegram</button>
  </div>

<script>
function redirect() {
  const url = window.location.href.split('?')[0] + '?open=1';
  window.location.href = url;
}

(function() {
  const params = new URLSearchParams(window.location.search);
  
  if (params.get('open') === '1') {
    setTimeout(() => {
      window.location = "tg://resolve?domain=amayaboutique";
    }, 400);

    setTimeout(() => {
      window.location.href = "https://t.me/amayaboutique";
    }, 1200);
  }
})();
</script>

</body>
</html>
