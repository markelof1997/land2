<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Открытие Telegram...</title>
  <meta http-equiv="refresh" content="2;url=https://t.me/theultimatee" />
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: #fafafa;
      color: #333;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top-color: #0088cc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Переходим в Telegram...</h2>
  <p>Если не открылось автоматически, нажмите <a href="https://t.me/theultimatee">сюда</a>.</p>

  <script>
    // Попытка открыть Telegram сразу
    setTimeout(() => {
      window.location.href = "https://t.me/theultimatee";
    }, 800);
  </script>
</body>
</html>
