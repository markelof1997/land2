<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Переход в Telegram</title>
  <style>
    body {
      font-family: "Inter", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #fafafa;
      text-align: center;
      color: #222;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }
    p {
      font-size: 16px;
      margin-bottom: 30px;
      color: #555;
    }
    button {
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 16px 34px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #0077b5;
    }
    .hint {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>Подключись к нашему Telegram</h1>
  <p>Нажми на кнопку ниже, чтобы открыть канал</p>

  <button id="openTelegram">Открыть Telegram</button>

  <div class="hint">
    Если не открылось — нажми ••• и выбери «Открыть в браузере»
  </div>

  <script>
    document.getElementById("openTelegram").addEventListener("click", () => {
      // Переход через серверный редирект на твоём домене
      window.location.href = "/api/telegram";
    });
  </script>
</body>
</html>
