<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Переходим в Telegram...</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
      background: #fafafa;
      color: #333;
    }
    .loader {
      width: 50px;
      height: 50px;
      border: 5px solid #ccc;
      border-top-color: #0088cc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #0088cc; text-decoration: none; }
  </style>
</head>
<body>
  <h2>Переходим в Telegram...</h2>
  <div class="loader"></div>
  <p>Если Telegram не открылся автоматически — <a href="https://t.me/theultimatee" target="_blank">нажмите сюда</a></p>

  <script>
    const telegramLink = "https://ultimatecommunity.mssg.me/";

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isTikTok = /tiktok/i.test(ua);

    if (isTikTok) {
      // TikTok встроенный браузер: открываем через window.open, чтобы выкинуть во внешний браузер
      const newWindow = window.open(telegramLink, "_blank");

      // Если блокирует, показываем подсказку
      if (!newWindow) {
        setTimeout(() => {
          alert("Если Telegram не открылся, нажмите ••• в TikTok и выберите 'Открыть в браузере', затем попробуйте снова 🔗");
        }, 800);
      }
    } else {
      // Обычные браузеры — редирект сразу
      window.location.href = telegramLink;
    }
  </script>
</body>
</html>
