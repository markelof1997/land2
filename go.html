<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Переходим в Telegram...</title>
  <style>
    body { text-align:center; padding:50px; font-family:sans-serif; background:#fafafa; color:#333; }
    .loader { width:50px; height:50px; border:5px solid #ccc; border-top-color:#0088cc; border-radius:50%; animation:spin 1s linear infinite; margin:20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color:#0088cc; text-decoration:none; }
  </style>
</head>
<body>
  <h2>Переходим в Telegram...</h2>
  <div class="loader"></div>
  <p>Если Telegram не открылся автоматически — <a href="tg://resolve?domain=theultimatee">нажмите сюда</a></p>

  <script>
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isTikTok = /tiktok/i.test(ua);

    if (isTikTok) {
      // создаём скрытую ссылку с tg://
      const link = document.createElement('a');
      link.href = "tg://resolve?domain=theultimatee";
      link.target = "_blank";
      document.body.appendChild(link);

      // кликаем по ней через JS
      setTimeout(() => { link.click(); }, 500);

      // fallback alert
      setTimeout(() => {
        alert("Если Telegram не открылся, нажмите ••• в TikTok и выберите 'Открыть в браузере'");
      }, 1200);
    } else {
      // Обычные браузеры — редирект через mssg.me
      window.location.href = "https://ultimatecommunity.mssg.me/";
    }
  </script>
</body>
</html>
