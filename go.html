<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Открыть Telegram</title>
  <style>
    body { 
      font-family: Inter, sans-serif;
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      text-align: center; 
      background: #fafafa; 
      color: #222;
    }
    h1 { font-size: 28px; margin-bottom: 20px; }
    p { font-size: 16px; margin-bottom: 30px; color: #555; }
    a.button {
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 16px 34px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    a.button:hover { background: #0077b5; }
  </style>
</head>
<body>
  <h1>Открыть Telegram</h1>
  <p>Нажми на кнопку ниже, чтобы открыть канал в Telegram</p>
  <a class="button" href="https://ultimatecommunity.mssg.me/" target="_blank" rel="noopener noreferrer">Перейти в Telegram</a>
  <p style="margin-top:20px; color:#777;">Если не открывается, нажми ••• → «Открыть в браузере»</p>
</body>
</html>
